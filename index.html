<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teorías pedagógicas contemporáneas: organizador comparativo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">
  <nav class="dock glass" id="dock" aria-label="Teorías pedagógicas"></nav>
  <main>
    <header class="title glass">
      <h1>Teorías pedagógicas contemporáneas</h1>
      <p>Elige una teoría en el menú y voltea cada tarjeta para ver su contenido.</p>
    </header>
    <section id="detalle">
      <div class="head glass">
        <h2 id="nombre"></h2>
        <p class="au" id="autores"></p>
        <p class="idea" id="idea"></p>
      </div>
      <div class="grid" id="grid"></div>
      <p class="hint">Toca una tarjeta para voltearla.</p>
    </section>
    <section id="comparativo" class="hidden" aria-label="Tabla comparativa">
      <div class="tablewrap glass"><table id="tabla"></table></div>
    </section>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
